{{ define "landing" }}<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<title>Log in · {{ .Data.Product }}</title>
	<meta name="robots" content="noindex" />
	{{ template "app-theme" . }}
	<style>
		body { min-height: 100vh; display: grid; place-items: center; padding: 1.25rem; box-sizing: border-box; }
		.login { width: 100%; max-width: 440px; padding: 1.6rem; box-sizing: border-box; }
		.brand { font-weight: 700; font-size: 1.15rem; display: flex; align-items: center; gap: 0.5rem; margin-bottom: 1.4rem; }
		.brand .dot { width: 0.75rem; height: 0.75rem; border-radius: 50%; background: var(--primary); }
		.login h1 { font-size: 1.2rem; margin: 0 0 0.25rem; }
		.login p { margin: 0 0 1rem; color: var(--muted-fg); font-size: 0.9rem; }
		.login form { display: flex; flex-direction: column; gap: 0.75rem; }
		.login .addr { display: flex; align-items: center; border: 1px solid var(--input); border-radius: var(--radius); padding-right: 0.7rem; }
		.login .addr:focus-within { border-color: var(--ring); box-shadow: 0 0 0 3px hsl(152 45% 40% / 0.2); }
		.login .addr input { border: 0; box-shadow: none; min-width: 0; }
		.login .addr span { color: var(--muted-fg); white-space: nowrap; font-size: 0.9rem; }
		.login .err { color: var(--destructive); font-size: 0.85rem; min-height: 1.2em; margin-top: 0.5rem; }
	</style>
</head>
<body>
	<main class="login card">
		<div class="brand"><span class="dot"></span>{{ .Data.Product }}</div>
		<h1>Log in to your workspace</h1>
		<p>Enter your workspace address.</p>
		<form id="login-form">
			<label class="addr">
				<input id="slug" name="slug" required autofocus autocomplete="organization" placeholder="brightclasses" aria-label="Workspace address" />
				<span>.{{ .Data.BaseDomain }}</span>
			</label>
			<button type="submit">Continue</button>
		</form>
		<div class="err" id="login-error" role="alert"></div>
	</main>

<script>
(function () {
	var form = document.getElementById('login-form');
	var slug = document.getElementById('slug');
	var err = document.getElementById('login-error');
	form.addEventListener('submit', function (e) {
		e.preventDefault();
		err.textContent = '';
		var value = slug.value.trim().toLowerCase();
		if (!value) return;
		fetch('/api/v1/workspaces/lookup?slug=' + encodeURIComponent(value))
			.then(function (r) { return r.json().then(function (j) { return { ok: r.ok, body: j }; }); })
			.then(function (res) {
				if (res.ok && res.body.data && res.body.data.url) {
					window.location.href = res.body.data.url + '/';
					return;
				}
				err.textContent = 'No workspace at ' + value + '.{{ .Data.BaseDomain }}. Check the address, or ask your administrator.';
			})
			.catch(function () { err.textContent = 'Something went wrong. Please try again.'; });
	});
})();
</script>
</body>
</html>
{{ end }}
