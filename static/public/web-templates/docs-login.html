{{ define "docs-login" }}<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<title>Docs · {{ .Data.Product }}</title>
	<meta name="robots" content="noindex, nofollow" />
	{{ template "app-theme" . }}
	<style>
		body { min-height: 100vh; display: grid; place-items: center; padding: 1.25rem; }
		.login { width: 100%; max-width: 400px; padding: 1.6rem; }
		.brand { font-weight: 700; font-size: 1.15rem; display: flex; align-items: center; gap: 0.5rem; margin-bottom: 1.4rem; }
		.brand .dot { width: 0.75rem; height: 0.75rem; border-radius: 50%; background: var(--primary); }
		.brand small { font-weight: 500; color: var(--muted-fg); font-size: 0.85rem; }
		.login h1 { font-size: 1.2rem; margin: 0 0 0.25rem; }
		.login p { margin: 0 0 1rem; color: var(--muted-fg); font-size: 0.9rem; }
		.login form { display: flex; flex-direction: column; gap: 0.75rem; }
		.login label { font-size: 0.85rem; font-weight: 500; display: grid; gap: 0.3rem; }
		.login .err { color: var(--destructive); font-size: 0.85rem; min-height: 1.2em; }
	</style>
</head>
<body>
	<main class="login card">
		<div class="brand"><span class="dot"></span>{{ .Data.Product }} <small>Docs</small></div>
		<h1>Log in to the documentation</h1>
		<p>Use the docs account a platform admin gave you.</p>
		<form id="login-form">
			<label>Email <input id="email" name="email" type="email" required autofocus autocomplete="username" /></label>
			<label>Password <input id="password" name="password" type="password" required autocomplete="current-password" /></label>
			<button type="submit" id="submit">Log in</button>
			<div class="err" id="login-error" role="alert"></div>
		</form>
	</main>

<script>
(function () {
	var form = document.getElementById('login-form');
	var err = document.getElementById('login-error');
	var btn = document.getElementById('submit');
	form.addEventListener('submit', function (e) {
		e.preventDefault();
		err.textContent = '';
		btn.disabled = true;
		fetch('/api/docs/login', {
			method: 'POST', credentials: 'same-origin', headers: { 'Content-Type': 'application/json' },
			body: JSON.stringify({ email: form.email.value, password: form.password.value })
		})
			.then(function (r) { return r.json().catch(function () { return {}; }).then(function (j) { return { ok: r.ok, body: j }; }); })
			.then(function (res) {
				if (res.ok) { window.location.reload(); return; }
				btn.disabled = false;
				err.textContent = res.body.message || 'Wrong email or password';
			})
			.catch(function () { btn.disabled = false; err.textContent = 'Something went wrong. Please try again.'; });
	});
})();
</script>
</body>
</html>
{{ end }}
