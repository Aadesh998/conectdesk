{{ define "platform" }}<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex" />
<title>Platform admin</title>
{{ template "app-theme" . }}
<style>
	/* Colours come from the app's theme (app-theme.html); warn is the one
	   addition, for limits close to being reached. */
	:root {
		--panel: var(--card); --text: var(--fg); --subtle: var(--muted-fg);
		--accent: var(--primary); --accent-text: var(--primary-fg);
		--ok: var(--success); --ok-bg: var(--success-bg); --bad: var(--destructive); --bad-bg: var(--destructive-bg);
		--hover: var(--muted);
		--warn: hsl(32 90% 40%); --warn-bg: hsl(32 90% 40% / 0.12);
		--track: hsl(0 0% 92%);
		--shadow: 0 1px 2px hsl(0 0% 0% / 0.04);
	}
	@media (prefers-color-scheme: dark) {
		:root { --warn: hsl(38 92% 62%); --warn-bg: hsl(38 92% 62% / 0.14); --track: hsl(150 3% 18%); --shadow: none; }
	}
	* { box-sizing: border-box; }
	body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.5 "Instrument Sans", system-ui, sans-serif; }
	a { color: inherit; }
	h1 { font-size: 1.6rem; font-weight: 600; letter-spacing: -0.015em; line-height: 1.2; margin: 0; }
	h2 { font-size: 0.95rem; font-weight: 600; margin: 0; }
	p { margin: 0; }
	.muted { color: var(--subtle); }
	.num { font-variant-numeric: tabular-nums; }
	code { font-size: 0.85em; }
	svg.i { width: 16px; height: 16px; flex: none; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

	/* Shell: a sidebar with the sections, the page beside it. */
	.shell { display: grid; grid-template-columns: 236px minmax(0, 1fr); min-height: 100vh; }
	.side { position: sticky; top: 0; height: 100vh; display: flex; flex-direction: column; gap: 1.5rem;
		padding: 1.25rem 0.85rem; background: var(--panel); border-right: 1px solid var(--border); }
	.brand { display: flex; align-items: center; gap: 0.6rem; padding: 0 0.5rem; text-decoration: none; }
	.brand .mark { width: 28px; height: 28px; border-radius: 8px; background: var(--accent); color: var(--accent-text);
		display: grid; place-items: center; font-weight: 700; font-size: 0.9rem; }
	.brand .name { font-weight: 600; line-height: 1.15; }
	.brand .name small { display: block; font-weight: 400; font-size: 0.78rem; color: var(--subtle); }
	.side nav { display: grid; gap: 2px; }
	.side nav a { display: flex; align-items: center; gap: 0.65rem; padding: 0.5rem 0.6rem; border-radius: var(--radius);
		color: var(--subtle); text-decoration: none; font-weight: 500; }
	.side nav a:hover { background: var(--hover); color: var(--text); }
	.side nav a.on { background: var(--hover); color: var(--text); }
	.side nav a.on svg { color: var(--accent); }
	.side .who { margin-top: auto; padding: 0.75rem 0.5rem 0; border-top: 1px solid var(--border); display: grid; gap: 0.5rem; }
	.side .who .email { font-size: 0.85rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
	main { padding: 2rem 2.5rem 4rem; min-width: 0; }
	.content { max-width: 1180px; margin: 0 auto; display: grid; gap: 1.5rem; }

	/* Page header: title and what it is on the left, actions on the right. */
	.page-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 1rem; flex-wrap: wrap; }
	.page-head .t { display: grid; gap: 0.35rem; min-width: 0; }
	.page-head .t .line { display: flex; align-items: center; gap: 0.75rem; flex-wrap: wrap; }
	.page-head .acts { display: flex; gap: 0.5rem; flex-wrap: wrap; }
	.back { display: inline-flex; align-items: center; gap: 0.35rem; color: var(--subtle); text-decoration: none; font-size: 0.85rem; width: fit-content; }
	.back:hover { color: var(--text); }

	/* Panels, with an optional head holding a title, a line on what it does and actions. */
	.panel { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; box-shadow: var(--shadow); min-width: 0; }
	.panel-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 1rem; padding: 1rem 1.25rem; border-bottom: 1px solid var(--border); }
	.panel-head .d { font-size: 0.84rem; color: var(--subtle); margin-top: 0.2rem; max-width: 62ch; }
	.panel-body { padding: 1rem 1.25rem; }
	.panel-foot { display: flex; align-items: center; justify-content: space-between; gap: 0.75rem; padding: 0.75rem 1.25rem; border-top: 1px solid var(--border); flex-wrap: wrap; }
	.panel.danger { border-color: color-mix(in srgb, var(--bad) 35%, transparent); }
	.scroll { overflow-x: auto; }

	/* Stats: one strip of numbers, divided rather than boxed. */
	.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); }
	.stat { padding: 1rem 1.25rem; border-left: 1px solid var(--border); }
	.stat:first-child { border-left: 0; }
	.stat .v { font-size: 1.55rem; font-weight: 600; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; line-height: 1.2; }
	.stat .l { color: var(--subtle); font-size: 0.82rem; margin-top: 0.15rem; }

	/* Meters: how much of a plan limit a workspace uses. */
	.meters { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 1.25rem 2rem; }
	.meter .top { display: flex; justify-content: space-between; align-items: baseline; gap: 0.5rem; }
	.meter .top .u { font-variant-numeric: tabular-nums; font-weight: 600; }
	.meter .top .u span { color: var(--subtle); font-weight: 400; }
	.meter .bar { height: 6px; border-radius: 99px; background: var(--track); margin-top: 0.5rem; overflow: hidden; }
	.meter .bar i { display: block; height: 100%; border-radius: inherit; background: var(--accent); transition: width 0.4s ease; }
	.meter.warn .bar i { background: var(--warn); }
	.meter.full .bar i { background: var(--bad); }
	.meter.full .top .u { color: var(--bad); }
	.meter .bar.none { background: repeating-linear-gradient(90deg, var(--track) 0 4px, transparent 4px 8px); }
	.facts { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 0.75rem 2rem; margin-top: 1.25rem; padding-top: 1rem; border-top: 1px dashed var(--border); }
	.facts div { display: grid; gap: 0.1rem; }
	.facts dt { color: var(--subtle); font-size: 0.8rem; }
	.facts dd { margin: 0; font-variant-numeric: tabular-nums; font-weight: 600; }

	/* Key-value list for a workspace's details. */
	dl.kv { margin: 0; display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 0.65rem 1rem; font-size: 0.88rem; }
	dl.kv dt { color: var(--subtle); }
	dl.kv dd { margin: 0; text-align: right; overflow-wrap: anywhere; }
	.inline { display: flex; gap: 0.5rem; align-items: center; }
	.inline select { flex: 1; }

	/* Tables. */
	table { width: 100%; border-collapse: collapse; }
	th, td { text-align: left; padding: 0.7rem 1rem; border-bottom: 1px solid var(--border); white-space: nowrap; vertical-align: middle; }
	th { color: var(--subtle); font-weight: 500; font-size: 0.78rem; background: var(--hover); }
	th:first-child, td:first-child { padding-left: 1.25rem; }
	th:last-child, td:last-child { padding-right: 1.25rem; }
	th.r, td.r { text-align: right; font-variant-numeric: tabular-nums; }
	tr:last-child td { border-bottom: 0; }
	tbody tr.link { cursor: pointer; }
	tbody tr.link:hover { background: var(--hover); }
	tbody tr.link:focus-visible { outline: 2px solid var(--ring); outline-offset: -2px; }
	td .sub { color: var(--subtle); font-size: 0.82rem; }
	td.wrap { white-space: normal; min-width: 220px; }
	.empty { padding: 2.5rem 1.25rem; text-align: center; color: var(--subtle); }

	/* Status badges and plan chips. */
	.badge { display: inline-flex; align-items: center; gap: 0.4rem; padding: 0.1rem 0.55rem; border-radius: 99px; font-size: 0.78rem; font-weight: 500; background: var(--hover); color: var(--subtle); }
	.badge::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
	.badge.active { color: var(--ok); background: var(--ok-bg); }
	.badge.suspended, .badge.deleting { color: var(--bad); background: var(--bad-bg); }
	.chip { display: inline-block; padding: 0.05rem 0.5rem; border-radius: 6px; border: 1px solid var(--border); font-size: 0.8rem; text-transform: capitalize; }

	/* Controls. */
	input, select, button { font: inherit; color: inherit; }
	input, select { width: auto; background: var(--panel); border: 1px solid var(--input); border-radius: var(--radius); padding: 0.5rem 0.7rem; }
	button { display: inline-flex; align-items: center; justify-content: center; gap: 0.4rem; background: var(--accent); color: var(--accent-text);
		border: 1px solid transparent; border-radius: var(--radius); padding: 0.5rem 0.9rem; cursor: pointer; font-weight: 500; white-space: nowrap; }
	button.ghost { background: var(--panel); color: var(--text); border-color: var(--border); }
	button.ghost:hover { background: var(--hover); filter: none; }
	button.danger { background: var(--bad); color: var(--card); }
	button.danger-ghost { background: transparent; color: var(--bad); border-color: color-mix(in srgb, var(--bad) 40%, transparent); }
	button.danger-ghost:hover { background: var(--bad-bg); filter: none; }
	button.sm { padding: 0.3rem 0.65rem; font-size: 0.85rem; }
	button:disabled { opacity: 0.5; cursor: default; filter: none; }
	a.button { display: inline-flex; align-items: center; gap: 0.4rem; text-decoration: none; border: 1px solid var(--border); background: var(--panel);
		border-radius: var(--radius); padding: 0.5rem 0.9rem; font-weight: 500; }
	a.button:hover { background: var(--hover); }
	button:focus-visible, a:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid var(--ring); outline-offset: 2px; }
	input[type=checkbox] { accent-color: var(--accent); }

	/* Switches, for what a workspace may use. */
	input.switch { appearance: none; -webkit-appearance: none; flex: none; width: 34px; height: 20px; margin: 0; padding: 0; border: 0;
		border-radius: 99px; background: var(--track); position: relative; cursor: pointer; transition: background 0.15s; }
	input.switch::before { content: ""; position: absolute; top: 2px; left: 2px; width: 16px; height: 16px; border-radius: 50%;
		background: #fff; box-shadow: 0 1px 2px hsl(0 0% 0% / 0.25); transition: transform 0.15s; }
	input.switch:checked { background: var(--accent); }
	input.switch:checked::before { transform: translateX(14px); }
	input.switch:disabled { cursor: default; opacity: 0.45; }
	.opts { display: grid; }
	.opt { display: flex; align-items: center; justify-content: space-between; gap: 0.75rem; padding: 0.6rem 0; border-bottom: 1px solid var(--border); cursor: pointer; }
	.opt:last-child { border-bottom: 0; }
	.opt.master { font-weight: 600; padding-top: 0; }
	.opt.off { color: var(--subtle); cursor: default; }
	.opts.cols { grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); column-gap: 2rem; }
	.opts.cols .master { grid-column: 1 / -1; }

	/* Forms. */
	.form { display: grid; gap: 1rem; }
	.form label.f { display: block; font-size: 0.84rem; font-weight: 500; margin-bottom: 0.35rem; }
	.form input:not([type=checkbox]), .form select { width: 100%; }
	.form .hint { color: var(--subtle); font-size: 0.8rem; margin-top: 0.3rem; }
	.form .pair { display: grid; grid-template-columns: 2fr 1fr; gap: 1rem; }
	.form .even { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
	.addr { display: flex; align-items: stretch; }
	.addr input { border-top-right-radius: 0; border-bottom-right-radius: 0; }
	.addr span { display: flex; align-items: center; padding: 0 0.7rem; border: 1px solid var(--input); border-left: 0; background: var(--hover);
		color: var(--subtle); border-radius: 0 var(--radius) var(--radius) 0; white-space: nowrap; }
	.note { font-size: 0.85rem; color: var(--subtle); background: var(--hover); border-radius: var(--radius); padding: 0.8rem 1rem; }
	.error { color: var(--bad); font-size: 0.88rem; }
	.error:empty { display: none; }

	/* Toolbar of the workspace list. */
	.toolbar { display: flex; gap: 0.75rem; padding: 0.85rem 1.25rem; border-bottom: 1px solid var(--border); flex-wrap: wrap; align-items: center; }
	.search { flex: 1; min-width: 240px; position: relative; }
	.search svg { position: absolute; left: 0.7rem; top: 50%; transform: translateY(-50%); color: var(--subtle); }
	.search input { width: 100%; padding-left: 2.1rem; }
	.seg { display: inline-flex; padding: 3px; gap: 2px; background: var(--hover); border-radius: calc(var(--radius) + 2px); }
	.seg button { background: transparent; color: var(--subtle); border: 0; padding: 0.35rem 0.75rem; font-size: 0.86rem; }
	.seg button.on { background: var(--panel); color: var(--text); box-shadow: 0 1px 2px hsl(0 0% 0% / 0.12); }

	/* Plan distribution on the overview. */
	.dist { display: grid; gap: 0.9rem; }
	.dist .row { display: grid; grid-template-columns: 110px minmax(0, 1fr) 48px; align-items: center; gap: 1rem; }
	.dist .row .n { text-align: right; font-variant-numeric: tabular-nums; font-weight: 600; }
	.dist .bar { height: 8px; border-radius: 99px; background: var(--track); overflow: hidden; }
	.dist .bar i { display: block; height: 100%; background: var(--accent); border-radius: inherit; }

	/* Workspace page: the record on the left, what can be changed on the right. */
	.ws-grid { display: grid; grid-template-columns: minmax(0, 1fr) 360px; gap: 1.5rem; align-items: start; }
	.ws-main, .ws-side { display: grid; gap: 1.5rem; min-width: 0; }
	.banner { display: flex; align-items: center; justify-content: space-between; gap: 1rem; flex-wrap: wrap;
		padding: 0.85rem 1.25rem; border-radius: 12px; background: var(--bad-bg); color: var(--bad); }
	.banner .acts { display: flex; gap: 0.5rem; }
	.danger-row { display: flex; align-items: center; justify-content: space-between; gap: 1rem; padding: 0.75rem 0; border-bottom: 1px solid var(--border); }
	.danger-row:first-child { padding-top: 0; }
	.danger-row:last-child { border-bottom: 0; padding-bottom: 0; }
	.danger-row .d { font-size: 0.82rem; color: var(--subtle); }

	/* Login and two-factor screens. */
	.login-wrap { min-height: 100vh; display: grid; place-items: center; padding: 2rem 1rem; }
	.login { width: 100%; max-width: 380px; display: grid; gap: 1rem; }
	.login .brand { padding: 0; margin-bottom: 0.5rem; }
	.login .panel { padding: 1.5rem; display: grid; gap: 0.9rem; }
	.login h1 { font-size: 1.3rem; }
	.login label { display: block; font-size: 0.84rem; font-weight: 500; margin-bottom: 0.35rem; }
	.login input { width: 100%; }
	.login button { width: 100%; margin-top: 0.25rem; }
	.login pre { margin: 0; padding: 0.8rem 1rem; background: var(--hover); border-radius: var(--radius); font-size: 0.9rem; line-height: 1.7; }
	.loading { color: var(--subtle); padding: 3rem 0; text-align: center; }

	#toast { position: fixed; bottom: 1.5rem; left: 50%; transform: translate(-50%, 1rem); opacity: 0; pointer-events: none;
		background: var(--text); color: var(--bg); padding: 0.65rem 1.1rem; border-radius: 10px; max-width: min(460px, calc(100vw - 2rem));
		box-shadow: 0 8px 24px hsl(0 0% 0% / 0.18); transition: opacity 0.18s, transform 0.18s; font-weight: 500; z-index: 10; }
	#toast.show { opacity: 1; transform: translate(-50%, 0); }
	#toast.bad { background: var(--bad); color: #fff; }
	@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }

	@media (max-width: 1080px) {
		.ws-grid { grid-template-columns: minmax(0, 1fr); }
	}
	/* Phones and narrow windows: the sidebar becomes a bar on top. */
	@media (max-width: 760px) {
		.shell { grid-template-columns: minmax(0, 1fr); }
		.side { position: static; height: auto; flex-direction: row; flex-wrap: wrap; align-items: center; gap: 0.75rem; padding: 0.75rem 1rem;
			border-right: 0; border-bottom: 1px solid var(--border); }
		.side nav { order: 3; flex-basis: 100%; display: flex; overflow-x: auto; gap: 0.25rem; }
		.side nav a { padding: 0.4rem 0.6rem; white-space: nowrap; }
		.side .who { margin: 0 0 0 auto; padding: 0; border: 0; display: flex; align-items: center; }
		.side .who .email { display: none; }
		main { padding: 1.25rem 1rem 3rem; }
		h1 { font-size: 1.35rem; }
		.stats { grid-template-columns: repeat(2, minmax(0, 1fr)); }
		.stat { border-left: 0; border-top: 1px solid var(--border); padding: 0.85rem 1rem; }
		.stat:nth-child(-n+2) { border-top: 0; }
		.stat:nth-child(even) { border-left: 1px solid var(--border); }
		.stat .v { font-size: 1.25rem; }
		.panel-head, .panel-body, .panel-foot, .toolbar { padding-left: 1rem; padding-right: 1rem; }
		.form .pair, .form .even { grid-template-columns: 1fr; }
		.search { min-width: 0; flex-basis: 100%; }
		.dist .row { grid-template-columns: 80px minmax(0, 1fr) 40px; }
	}
	/* Dialogs for adding people and giving them passwords. */
	dialog.dlg { border: 1px solid var(--border); border-radius: 12px; background: var(--panel); color: var(--text); padding: 0; width: min(460px, calc(100vw - 32px)); box-shadow: 0 20px 50px rgb(0 0 0 / 0.25); }
	dialog.dlg::backdrop { background: rgb(0 0 0 / 0.4); }
	dialog.dlg .dlg-head { display: flex; justify-content: space-between; align-items: center; padding: 1rem 1.25rem; border-bottom: 1px solid var(--border); }
	dialog.dlg .dlg-head h2 { font-size: 1rem; margin: 0; }
	dialog.dlg .dlg-body { padding: 1.1rem 1.25rem 1.25rem; }
	dialog.dlg .acts { display: flex; justify-content: flex-end; gap: 0.5rem; margin-top: 0.25rem; }
	.secret { display: flex; gap: 0.5rem; align-items: center; }
	.secret code { flex: 1; font-size: 1.05rem; padding: 0.55rem 0.7rem; background: var(--hover); border-radius: var(--radius); user-select: all; word-break: break-all; }
	.row-acts { display: flex; gap: 0.35rem; justify-content: flex-end; flex-wrap: wrap; }
	.warn-note { color: var(--bad); background: var(--bad-bg); border-radius: var(--radius); padding: 0.6rem 0.75rem; font-size: 0.85rem; }
	.ok-note { color: var(--ok); background: var(--ok-bg); border-radius: var(--radius); padding: 0.6rem 0.75rem; font-size: 0.85rem; }
</style>
</head>
<body>
<div id="app"></div>
<div id="toast" role="status" aria-live="polite"></div>
<script>
(function () {
	'use strict';
	var app = document.getElementById('app');
	var me = null;
	var baseDomain = '{{ .Data.BaseDomain }}';

	// el builds an element; strings become text nodes, never HTML.
	function el(tag, attrs) {
		var e = document.createElement(tag);
		for (var k in (attrs || {})) {
			var v = attrs[k];
			if (v === null || v === undefined || v === false) continue;
			if (k.slice(0, 2) === 'on') e.addEventListener(k.slice(2), v);
			else if (k === 'text') e.textContent = v;
			else e.setAttribute(k, v === true ? '' : v);
		}
		for (var i = 2; i < arguments.length; i++) {
			var c = arguments[i];
			if (c === null || c === undefined || c === false) continue;
			(Array.isArray(c) ? c : [c]).forEach(function (x) {
				if (x === null || x === undefined || x === false) return;
				e.appendChild(typeof x === 'object' ? x : document.createTextNode(String(x)));
			});
		}
		return e;
	}

	// icon draws a 16px stroke icon.
	var icons = {
		overview: 'M3 3h7v9H3z M14 3h7v5h-7z M14 12h7v9h-7z M3 16h7v5H3z',
		workspaces: 'M6 22V4a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v18Z M6 12H4a2 2 0 0 0-2 2v6a2 2 0 0 0 2 2h2 M18 9h2a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2h-2 M10 6h4 M10 10h4 M10 14h4 M10 18h4',
		audit: 'M8 6h13 M8 12h13 M8 18h13 M3 6h.01 M3 12h.01 M3 18h.01',
		settings: 'M4 4h16a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2z M22 6l-10 7L2 6',
		search: 'M11 19a8 8 0 1 0 0-16 8 8 0 0 0 0 16z M21 21l-4.35-4.35',
		external: 'M15 3h6v6 M10 14 21 3 M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6',
		back: 'M19 12H5 M12 19l-7-7 7-7',
		logout: 'M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4 M16 17l5-5-5-5 M21 12H9',
		plus: 'M12 5v14 M5 12h14',
		docs: 'M2 4h6a4 4 0 0 1 4 4v13a3 3 0 0 0-3-3H2z M22 4h-6a4 4 0 0 0-4 4v13a3 3 0 0 1 3-3h7z'
	};
	function icon(name) {
		var ns = 'http://www.w3.org/2000/svg';
		var s = document.createElementNS(ns, 'svg');
		s.setAttribute('viewBox', '0 0 24 24'); s.setAttribute('class', 'i'); s.setAttribute('aria-hidden', 'true');
		var p = document.createElementNS(ns, 'path'); p.setAttribute('d', icons[name]);
		s.appendChild(p);
		return s;
	}

	function cookie(name) {
		var m = document.cookie.match(new RegExp('(?:^|; )' + name + '=([^;]*)'));
		return m ? decodeURIComponent(m[1]) : '';
	}

	function api(method, path, body) {
		var opts = { method: method, headers: {}, credentials: 'same-origin' };
		if (method !== 'GET') opts.headers['X-Platform-CSRF'] = cookie('platform_csrf');
		if (body !== undefined) { opts.headers['Content-Type'] = 'application/json'; opts.body = JSON.stringify(body); }
		return fetch('/api/platform/' + path, opts).then(function (r) {

				});
			}

			var pw = passwordFields();
			var save = el('button', { type: 'submit', text: 'Add viewer' });
			var form = el('form', { class: 'form', onsubmit: function (e) {
				e.preventDefault();
				var body = pw.read(); body.email = e.target.email.value;
				save.disabled = true;
				api('POST', 'docs-viewers', body).then(function (res) { showCredentials('Docs viewer added', body.email, res); docsAccess(); })
					.catch(function (x) { save.disabled = false; fail(x); });
			} },
				field('Email', el('input', { id: 'd_email', name: 'email', type: 'email', required: true, autocomplete: 'off', style: 'width:100%' })),
				pw.nodes,
				el('div', null, save));

			var list = table(['Email', 'Status', 'Added', 'Last login', ''], d.viewers.map(function (v) {
				return { item: v, cells: [v.email,
					el('span', { class: 'badge ' + (v.enabled ? 'active' : 'suspended'), text: v.enabled ? 'Active' : 'Suspended' }),
					date(v.created_at), v.last_login_at ? ago(v.last_login_at) : 'Never',
					el('div', { class: 'row-acts' },
						el('button', { class: 'ghost sm', onclick: function () { setPassword(v.email, 'New password for ' + v.email); }, text: 'New password' }),
						v.enabled
							? el('button', { class: 'ghost sm', onclick: function () { setStatus(v, false); }, text: 'Suspend' })
							: el('button', { class: 'ghost sm', onclick: function () { setStatus(v, true); }, text: 'Restore' }),
						el('button', { class: 'danger-ghost sm', onclick: function () {
							confirmThen('Delete ' + v.email + '? Their docs login is removed and they are logged out at once.', function () {
								api('POST', 'docs-viewers/remove', { email: v.email }).then(function () { toast('Deleted ' + v.email); docsAccess(); }).catch(fail);
							});
						}, text: 'Delete' }))] };
			}), null, 'No one has docs access yet.');

			layout('docs', [
				pageHead('Docs access', null, d.url ? el('a', { href: d.url, target: '_blank', rel: 'noopener', class: 'button ghost' }, icon('external'), 'Open the docs') : null),
				el('p', { class: 'muted', style: 'margin-top:-0.9rem;max-width:72ch' }, 'People listed here can log in to the internal documentation at ',
					el('code', { text: d.url || 'docs.' + baseDomain }), ' and nothing else: not this dashboard and no workspace. A platform admin login doesn’t open the docs, so add yourself here too if you read them.'),
				el('div', { class: 'ws-grid' },
					el('div', { class: 'ws-main' }, panel('Docs viewers', null, list, { flush: true })),
					el('div', { class: 'ws-side' }, panel('Add a viewer', 'Passwords go out through the platform’s mail server (Settings).', form)))
			]);
		}).catch(fail);
	}

	function route() {
		if (!me) return;
		var h = location.hash.replace(/^#/, '') || '/';
		var m = h.match(/^\/workspaces\/(\d+)$/);
		if (m) workspace(m[1]);
		else if (h === '/workspaces/new') newWorkspace();
		else if (h === '/workspaces') workspaces();
		else if (h === '/audit') audit();
		else if (h === '/settings') settingsPage();
		else if (h === '/docs') docsAccess();
		else overview();
	}

	function boot() {
		return api('GET', 'me').then(function (d) {
			me = d;
			if (d.two_factor_required && !d.totp_enabled) return renderTwoFactorSetup();
			route();
		});
	}

	window.addEventListener('hashchange', route);
	boot().catch(function () { if (!me) renderLogin(); });
})();
</script>
</body>
</html>
{{ end }}
