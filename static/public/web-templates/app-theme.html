{{ define "app-theme" }}
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400..700&display=swap" rel="stylesheet" />
<style>
	/* The app's own theme (frontend/shared-ui/assets/styles/main.scss). */
	:root {
		--bg: hsl(0 0% 100%); --fg: hsl(240 10% 3.9%); --card: hsl(0 0% 100%);
		--muted: hsl(240 4.8% 95.9%); --muted-fg: hsl(240 3.8% 46.1%);
		--border: hsl(240 5.9% 90%); --input: hsl(240 5.9% 90%);
		--primary: hsl(224.3 76.3% 48%); --primary-fg: hsl(213.8 100% 96.9%); --ring: hsl(240 5% 64.9%);
		--ring-glow: hsl(240 5% 64.9% / 0.5);
		--destructive: hsl(0 72.2% 50.6%); --destructive-bg: hsl(0 72.2% 50.6% / 0.1);
		--success: hsl(142.1 76.2% 36.3%); --success-bg: hsl(142.1 76.2% 36.3% / 0.12);
		--radius: 0.25rem;
	}
	@media (prefers-color-scheme: dark) {
		:root {
			--bg: hsl(240 10% 3.9%); --fg: hsl(0 0% 98%); --card: hsl(240 5.9% 10%);
			--muted: hsl(240 3.7% 15.9%); --muted-fg: hsl(240 5% 64.9%);
			--border: hsl(240 3.7% 15.9%); --input: hsl(240 4% 19%);
			--primary: hsl(221.2 83.2% 53.3%); --primary-fg: hsl(0 0% 100%); --ring: hsl(240 3.8% 46.1%);
			--ring-glow: hsl(240 3.8% 46.1% / 0.5);
			--destructive: hsl(0 91% 71.4%); --destructive-bg: hsl(0 91% 71.4% / 0.12);
			--success: hsl(142.1 70.6% 45.3%); --success-bg: hsl(142.1 70.6% 45.3% / 0.14);
		}
	}
	* { box-sizing: border-box; }
	body { margin: 0; background: var(--bg); color: var(--fg); font: 14px/1.5 "Geist", system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
	a { color: var(--primary); }
	input, select, button, textarea { font: inherit; color: inherit; }
	input, select { width: 100%; background: transparent; border: 1px solid var(--input); border-radius: var(--radius); padding: 0.55rem 0.75rem; outline: none; }
	input:focus, select:focus { border-color: var(--ring); box-shadow: 0 0 0 3px var(--ring-glow); }
	button { background: var(--primary); color: var(--primary-fg); border: 0; border-radius: var(--radius); padding: 0.6rem 1rem; font-weight: 500; cursor: pointer; }
	button:hover { background: color-mix(in srgb, var(--primary) 90%, transparent); }
	button:disabled { opacity: 0.55; cursor: default; filter: none; }
	.card { background: var(--card); border: 1px solid var(--border); border-radius: calc(var(--radius) + 4px); box-shadow: 0 1px 2px hsl(240 10% 4% / 0.05); }
	.muted { color: var(--muted-fg); }
	.page { min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 2rem 1rem; }
	.auth { width: 100%; max-width: 440px; padding: 1.75rem; }
	.auth h1 { font-size: 1.25rem; font-weight: 600; letter-spacing: -0.025em; text-align: center; margin: 0 0 0.25rem; }
	.auth .sub { text-align: center; color: var(--muted-fg); margin: 0 0 1.25rem; }
	.auth label { display: block; margin: 0.9rem 0 0.35rem; font-size: 0.875rem; color: var(--muted-fg); }
	.auth .hint { font-size: 0.8rem; color: var(--muted-fg); margin-top: 0.3rem; }
	.auth .hint.ok { color: var(--success); }
	.auth .hint.bad { color: var(--destructive); }
	.auth .alert { margin-top: 1rem; padding: 0.7rem 0.8rem; border: 1px solid var(--destructive); background: var(--destructive-bg); color: var(--destructive); border-radius: var(--radius); font-size: 0.875rem; }
	.auth .alert:empty { display: none; }
	.auth button.wide { width: 100%; margin-top: 1.4rem; }
	.powered { margin-top: 1.5rem; font-size: 0.75rem; color: var(--muted-fg); }
</style>
{{ end }}
